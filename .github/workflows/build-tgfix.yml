name: Build Telegram Fix

on:
  push:
    branches: [main]
    paths:
      - 'TelegramFix/**'
      - '.github/workflows/build-tgfix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl unzip fakeroot \
            libtinfo6 rsync git perl dpkg cmake python3

      - name: Cache Theos + toolchain
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |- 
            theos
            ~/theos
          key: theos-ubuntu-v7

      - name: Build TelegramFix
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS="$THEOS"
          export PATH="$THEOS/bin:$THEOS/toolchain/linux/iphone/bin:$PATH"
          echo "THEOS=$THEOS"
          echo "PATH=$PATH"
          ls "$THEOS/bin/dm.pl" && echo "dm.pl OK" || echo "dm.pl MISSING"
          ls "$THEOS/toolchain/linux/iphone/bin/clang++" && echo "Toolchain OK" || echo "Toolchain MISSING"
          cd TelegramFix
          make package FINALPACKAGE=1 2>&1 | tee ../build-tgfix.log

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramFix-arm
          path: TelegramFix/packages/*.deb
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgfix-build-log
          path: build-tgfix.log
          retention-days: 7
