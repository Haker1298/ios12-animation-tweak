name: Build iOS 12 Animation Tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang lld llvm \
            curl unzip fakeroot libtinfo6 libz3-dev \
            rsync git perl dpkg

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-ubuntu-v5

      - name: Install Theos manually
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # Theos нужен NIC (New Instance Creator) для шаблонов, но мы собираем вручную
          "$THEOS/bin/swift" --version 2>/dev/null || true
          ls "$THEOS/makefiles/"

      - name: Download iOS SDK
        run: |
          SDK_DIR="$THEOS/sdks"
          mkdir -p "$SDK_DIR"
          if ! ls "$SDK_DIR"/*.sdk 1>/dev/null 2>&1; then
            curl -LO https://github.com/theos/sdks/archive/master.zip
            unzip -q master.zip
            cp -R sdks-master/*.sdk "$SDK_DIR/" 2>/dev/null || true
            rm -rf sdks-master master.zip
          fi
          echo "SDKs:"
          ls -1 "$SDK_DIR"/

      - name: Verify Theos setup
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/makefiles/common.mk" && echo "Theos OK" || { echo "Theos MISSING"; exit 1; }
          which clang && clang --version | head -1

      - name: Build tweak
        run: |
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 2>&1 | tee build.log || true
          echo "=== TAIL OF BUILD LOG ==="
          tail -50 build.log

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS12Animation-arm
          path: packages/*.deb
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7