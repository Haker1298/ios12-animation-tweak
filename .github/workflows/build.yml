name: Build iOS 12 Animation Tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl unzip fakeroot \
            libtinfo6 rsync git perl dpkg cmake python3

      - name: Cache Theos + toolchain
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |-
            theos
            ~/theos
          key: theos-ubuntu-v7

      - name: Install Theos + iOS toolchain
        if: steps.cache-theos.outputs.cache-hit != 'true'
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS="$THEOS"
          # Устанавливаем Theos (включая загрузку iOS тулчейна для Linux)
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          # Проверяем наличие тулчейна
          echo "=== Checking toolchain ==="
          ls "$THEOS/toolchain/linux/iphone/bin/clang++" 2>/dev/null && echo "Toolchain OK" || {
            echo "Toolchain missing, downloading manually..."
            mkdir -p "$THEOS/toolchain/linux/iphone"
            curl -LO https://github.com/theos/toolchain/releases/latest/download/linux-iphone-toolchain.tar.lzma
            tar --lzma -xf linux-iphone-toolchain.tar.lzma -C "$THEOS/toolchain/linux/iphone" --strip-components=1
            rm -f linux-iphone-toolchain.tar.lzma
            ls "$THEOS/toolchain/linux/iphone/bin/clang++" && echo "Manual toolchain OK"
          }
          echo "=== Checking SDK ==="
          ls "$THEOS/sdks"/

      - name: Download iOS SDK if missing
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          THEOS="$THEOS"
          SDK_DIR="$THEOS/sdks"
          mkdir -p "$SDK_DIR"
          if ! ls "$SDK_DIR"/*.sdk 1>/dev/null 2>&1; then
            curl -LO https://github.com/theos/sdks/archive/master.zip
            unzip -q master.zip
            cp -R sdks-master/*.sdk "$SDK_DIR/" 2>/dev/null || true
            rm -rf sdks-master master.zip
          fi
          echo "Available SDKs:"
          ls -1 "$SDK_DIR"/

      - name: Build tweak
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS="$THEOS"
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS"
          ls "$THEOS/makefiles/common.mk" && echo "Makefiles OK"
          ls "$THEOS/toolchain/linux/iphone/bin/clang++" && echo "Toolchain OK"
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS12Animation-arm
          path: packages/*.deb
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
